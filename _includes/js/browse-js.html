<script>
    /* =========================================================
       Existing object files generated by Jekyll
       This prevents requesting missing cover files.
       ========================================================= */

    const EXISTING_OBJECT_FILES = new Set([
      {% assign object_files = site.static_files | where_exp: "file", "file.path contains '/objects/'" %}
      {% for file in object_files %}
        "{{ file.name | escape }}"{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]);

    /* =========================================================
       Settings
       ========================================================= */

    const ITEMS_PER_PAGE = 20;
    const DEFAULT_SORT_KEY = "seriesnumber";
    const DEFAULT_SORT_LABEL = "Column Number";

    /* =========================================================
       Helpers
       ========================================================= */

    function hasValue(value) {
      return value !== undefined && value !== null && String(value).trim() !== "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getObjectTitle(item) {
      if (!item) return "Untitled";

      return (
        item.title ||
        item.title_eng ||
        item.title_page_title ||
        item.title_tib ||
        item.filename ||
        "Untitled"
      );
    }

    function getFormatFromFilename(item) {
      if (!item || !hasValue(item.filename)) {
        return "record";
      }

      const filename = String(item.filename).toLowerCase().trim();

      if (filename.endsWith(".pdf")) {
        return "pdf";
      }

      if (/\.(jpg|jpeg|png|gif|webp|tif|tiff|bmp|svg)$/.test(filename)) {
        return "image";
      }

      if (/\.(mp3|wav|m4a|flac|ogg)$/.test(filename)) {
        return "audio";
      }

      if (/\.(mp4|mov|webm|m4v|avi)$/.test(filename)) {
        return "video";
      }

      return "record";
    }

    function resolveProjectPath(value, defaultDirectory) {
      if (!hasValue(value)) {
        return "";
      }

      const raw = String(value).trim();

      if (/^https?:\/\//i.test(raw)) {
        return raw;
      }

      if (raw.includes("/")) {
        return "{{ '' | relative_url }}" + (raw.startsWith("/") ? raw : "/" + raw);
      }

      return (
        "{{ '' | relative_url }}/" +
        defaultDirectory.replace(/^\/|\/$/g, "") +
        "/" +
        raw
      );
    }

    function getFilenameOnly(value) {
      if (!hasValue(value)) return "";

      return String(value)
        .trim()
        .split("/")
        .pop();
    }

    function findFileLink(item) {
      return resolveProjectPath(item && item.filename, "objects");
    }

    function findCoverLink(item) {
      if (!item || !hasValue(item.cover)) {
        return "";
      }

      const rawCover = String(item.cover).trim();

      if (/^https?:\/\//i.test(rawCover)) {
        return rawCover;
      }

      const coverFilename = getFilenameOnly(rawCover);

      if (!EXISTING_OBJECT_FILES.has(coverFilename)) {
        return "";
      }

      return resolveProjectPath(rawCover, "objects");
    }

    function getBrowseSubtitle(item) {
      const parts = [];

      if (hasValue(item.author)) {
        parts.push(item.author);
      }

      if (hasValue(item.pub_year)) {
        parts.push(item.pub_year);
      }

      if (hasValue(item.series_eng)) {
        parts.push(item.series_eng);
      } else if (hasValue(item.series)) {
        parts.push(item.series);
      }

      if (hasValue(item.seriesnumber)) {
        parts.push("Vol. " + item.seriesnumber);
      }

      return parts.join(" · ");
    }

    /* =========================================================
       Thumbnail
       ========================================================= */

    function getThumbHTML(item) {
      const title = getObjectTitle(item);
      const coverLink = findCoverLink(item);

      if (coverLink) {
        return `
          <div class="bg-light overflow-hidden border-bottom" style="aspect-ratio: 3 / 4;">
            <img
              class="card-img-top w-100 h-100"
              src="${coverLink}"
              loading="lazy"
              alt="Cover of ${escapeHtml(title)}"
              style="object-fit: contain;"
              onerror="
                this.onerror = null;
                this.remove();
              "
            >
          </div>
        `;
      }

      return `
        <div class="bg-light overflow-hidden border-bottom" style="aspect-ratio: 3 / 4;"></div>
      `;
    }

    /* =========================================================
       Card
       ========================================================= */

    function recordToCard(item) {
      const title = getObjectTitle(item);
      const subtitle = getBrowseSubtitle(item);
      const format = getFormatFromFilename(item);

      const itemUrl =
        "{{ '/item.html' | relative_url }}?id=" +
        encodeURIComponent(item.objectid);

      const formatBadge =
        format === "record"
          ? ""
          : `<span class="badge bg-light text-dark border">${format.toUpperCase()}</span>`;

      return `
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">

            ${getThumbHTML(item)}

            <div class="card-body">
              <h3 class="h6 card-title mb-2">
                <a
                  class="stretched-link text-decoration-none"
                  href="${itemUrl}"
                >
                  ${escapeHtml(title)}
                </a>
              </h3>

              ${
                subtitle
                  ? `<div class="small text-muted">${escapeHtml(subtitle)}</div>`
                  : ""
              }
            </div>

            <div class="card-footer d-flex justify-content-between align-items-center">
              <small class="text-muted">
                ${escapeHtml(item.objectid || "")}
              </small>

              ${formatBadge}
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       Search
       ========================================================= */

    function normalize(value) {
      return String(value ?? "")
        .toLowerCase()
        .trim();
    }

    function itemMatchesQuery(item, query) {
      if (!query) {
        return true;
      }

      const normalizedQuery = normalize(query);

      const searchableValues = [
        item.objectid,
        item.seriesnumber,
        item.filename,
        item.cover,

        item.title,
        item.title_tib,
        item.title_eng,
        item.title_page_title,
        item.title_page_title_tib,
        item.title_chi_pinyin,
        item.title_chi_characters,

        item.author,
        item.author_tib,
        item.author_phonetics,

        item.pub_year,
        item.ISBN,
        item.bdrc_description,

        item.subjects,
        item.subject_year,

        item.location,
        item.location_tib,

        item.series,
        item.series_tib,
        item.series_eng,
        item.series_chi_pinyin,
        item.series_chi_characters,

        item.publisher,
        item.publisher_tib,
        item.publisher_chi_pinyin,
      ];

      const haystack = searchableValues
        .filter(hasValue)
        .map(normalize)
        .join(" ");

      return haystack.includes(normalizedQuery);
    }

    /* =========================================================
       Sorting
       ========================================================= */

    function shuffleItems(items) {
      const shuffled = items.slice();

      for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[randomIndex]] = [
          shuffled[randomIndex],
          shuffled[i],
        ];
      }

      return shuffled;
    }

    function compareValues(a, b) {
      const aValue = hasValue(a) ? String(a).trim() : "";
      const bValue = hasValue(b) ? String(b).trim() : "";

      const aNumber = Number(aValue);
      const bNumber = Number(bValue);

      const bothNumeric =
        aValue !== "" &&
        bValue !== "" &&
        !Number.isNaN(aNumber) &&
        !Number.isNaN(bNumber);

      if (bothNumeric) {
        return aNumber - bNumber;
      }

      return aValue.localeCompare(bValue, undefined, {
        numeric: true,
        sensitivity: "base",
      });
    }

    function sortItems(items, key) {
      if (key === "random") {
        return shuffleItems(items);
      }

      if (key === "title") {
        return items
          .slice()
          .sort((a, b) =>
            getObjectTitle(a).localeCompare(getObjectTitle(b), undefined, {
              numeric: true,
              sensitivity: "base",
            })
          );
      }

      return items
        .slice()
        .sort((a, b) => compareValues(a[key], b[key]));
    }

   /* =========================================================
     Pagination
     ========================================================= */

  function getTotalPages(items) {
    return Math.max(1, Math.ceil(items.length / ITEMS_PER_PAGE));
  }

  function getPageItems(items, currentPage) {
    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const endIndex = startIndex + ITEMS_PER_PAGE;

    return items.slice(startIndex, endIndex);
  }

  function getPaginationParts(currentPage, totalPages) {
    const parts = [];

    if (totalPages <= 7) {
      for (let page = 1; page <= totalPages; page++) {
        parts.push(page);
      }
      return parts;
    }

    parts.push(1);

    if (currentPage > 4) {
      parts.push("ellipsis-left");
    }

    const start = Math.max(2, currentPage - 2);
    const end = Math.min(totalPages - 1, currentPage + 2);

    for (let page = start; page <= end; page++) {
      parts.push(page);
    }

    if (currentPage < totalPages - 3) {
      parts.push("ellipsis-right");
    }

    parts.push(totalPages);

    return parts;
  }

  function ensurePaginationContainer() {
    let pagination = document.getElementById("browsePagination");
    const browseItems = document.getElementById("browseItems");

    if (!pagination && browseItems) {
      pagination = document.createElement("div");
      pagination.id = "browsePagination";
      pagination.className = "d-flex justify-content-center my-4";
      browseItems.insertAdjacentElement("afterend", pagination);
    }

    return pagination;
  }

  function renderPagination(totalItems, currentPage) {
    const pagination = ensurePaginationContainer();

    if (!pagination) {
      return;
    }

    const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

    if (totalPages <= 1) {
      pagination.innerHTML = "";
      return;
    }

    const parts = getPaginationParts(currentPage, totalPages);

    const firstDisabled = currentPage === 1 ? " disabled" : "";
    const previousDisabled = currentPage === 1 ? " disabled" : "";
    const nextDisabled = currentPage === totalPages ? " disabled" : "";
    const lastDisabled = currentPage === totalPages ? " disabled" : "";

    let pageButtons = "";

    parts.forEach((part) => {
      if (typeof part === "string" && part.includes("ellipsis")) {
        pageButtons += `
          <li class="page-item disabled">
            <span class="page-link">…</span>
          </li>
        `;
        return;
      }

      const activeClass = part === currentPage ? " active" : "";

      pageButtons += `
        <li class="page-item${activeClass}">
          <button class="page-link" type="button" data-page="${part}">
            ${part}
          </button>
        </li>
      `;
    });

    pagination.innerHTML = `
      <nav aria-label="Arura pagination">
        <ul class="pagination flex-wrap justify-content-center">

          <li class="page-item${firstDisabled}">
            <button class="page-link" type="button" data-page="1">
              First
            </button>
          </li>

          <li class="page-item${previousDisabled}">
            <button class="page-link" type="button" data-page="${currentPage - 1}">
              Previous
            </button>
          </li>

          ${pageButtons}

          <li class="page-item${nextDisabled}">
            <button class="page-link" type="button" data-page="${currentPage + 1}">
              Next
            </button>
          </li>

          <li class="page-item${lastDisabled}">
            <button class="page-link" type="button" data-page="${totalPages}">
              Last
            </button>
          </li>

        </ul>
      </nav>
    `;
  }
    /* =========================================================
       Render
       ========================================================= */

    function renderBrowse(items, currentPage) {
      const browseItems = document.getElementById("browseItems");
      const numberOf = document.getElementById("numberOf");

      if (!browseItems) {
        return;
      }

      const totalItems = items.length;
      const totalPages = getTotalPages(items);
      const safeCurrentPage = Math.min(Math.max(currentPage, 1), totalPages);
      const pageItems = getPageItems(items, safeCurrentPage);

      if (totalItems === 0) {
        browseItems.innerHTML = `
          <div class="col-12">
            <div class="alert alert-secondary text-center">
              No items found.
            </div>
          </div>
        `;
      } else {
        browseItems.innerHTML = pageItems.map(recordToCard).join("");
      }

      if (numberOf) {
        if (totalItems === 0) {
          numberOf.textContent = "0 items";
        } else {
          const startItem = (safeCurrentPage - 1) * ITEMS_PER_PAGE + 1;
          const endItem = Math.min(safeCurrentPage * ITEMS_PER_PAGE, totalItems);

          numberOf.textContent =
            totalItems === 1
              ? "1 item"
              : `${totalItems} items · Showing ${startItem}–${endItem}`;
        }
      }

      renderPagination(totalItems, safeCurrentPage);
    }

    /* =========================================================
       Page state and controls
       ========================================================= */

    (function () {
      const loadingIcon = document.getElementById("loadingIcon");
      const filterInput = document.getElementById("filterTextBox");
      const sortLabel = document.getElementById("sortFilter");

      let allItems = [];
      let visibleItems = [];
      let currentPage = 1;

      function getActiveSortKey() {
        const activeButton = document.querySelector(
          ".browse-sort-item.active"
        );

        return activeButton
          ? activeButton.getAttribute("data-filter")
          : DEFAULT_SORT_KEY;
      }

      function setActiveSort(key) {
        document
          .querySelectorAll(".browse-sort-item")
          .forEach((button) => button.classList.remove("active"));

        const targetButton = document.querySelector(
          `.browse-sort-item[data-filter="${key}"]`
        );

        if (targetButton) {
          targetButton.classList.add("active");

          if (sortLabel) {
            sortLabel.textContent = targetButton.textContent.trim();
          }
        } else if (sortLabel) {
          sortLabel.textContent = DEFAULT_SORT_LABEL;
        }
      }

      function updateBrowse(options = {}) {
        const resetPage = options.resetPage !== false;

        if (resetPage) {
          currentPage = 1;
        }

        const query = filterInput
          ? filterInput.value.trim()
          : "";

        const sortKey = getActiveSortKey();

        visibleItems = allItems.filter((item) =>
          itemMatchesQuery(item, query)
        );

        visibleItems = sortItems(visibleItems, sortKey);

        renderBrowse(visibleItems, currentPage);
      }

      window.submitFilter = function () {
        updateBrowse({ resetPage: true });
      };

      window.resetFilter = function () {
        if (filterInput) {
          filterInput.value = "";
        }

        setActiveSort(DEFAULT_SORT_KEY);
        updateBrowse({ resetPage: true });
      };

      document.addEventListener("click", function (event) {
        const sortButton = event.target.closest(".browse-sort-item");

        if (sortButton) {
          document
            .querySelectorAll(".browse-sort-item")
            .forEach((button) => button.classList.remove("active"));

          sortButton.classList.add("active");

          if (sortLabel) {
            sortLabel.textContent = sortButton.textContent.trim();
          }

          updateBrowse({ resetPage: true });
          return;
        }

        const pageButton = event.target.closest("#browsePagination .page-link");

        if (pageButton) {
          const requestedPage = Number(pageButton.getAttribute("data-page"));
          const totalPages = getTotalPages(visibleItems);

          if (
            Number.isNaN(requestedPage) ||
            requestedPage < 1 ||
            requestedPage > totalPages
          ) {
            return;
          }

          currentPage = requestedPage;
          renderBrowse(visibleItems, currentPage);

          const browseHeading = document.getElementById("browseFilter");

          if (browseHeading) {
            browseHeading.scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          }
        }
      });

      const browseInit = function (cb_items) {
        try {
          allItems = Array.isArray(cb_items)
            ? cb_items.filter(
                (item) =>
                  item &&
                  hasValue(item.objectid) &&
                  !hasValue(item.parentid)
              )
            : [];

          setActiveSort(DEFAULT_SORT_KEY);

          visibleItems = sortItems(allItems, DEFAULT_SORT_KEY);

          currentPage = 1;

          renderBrowse(visibleItems, currentPage);
        } catch (error) {
          console.error("Browse initialization failed:", error);

          const browseItems =
            document.getElementById("browseItems");

          if (browseItems) {
            browseItems.innerHTML = `
              <div class="col-12">
                <div class="alert alert-danger">
                  The browse page could not load the collection data.
                  Check the browser console for details.
                </div>
              </div>
            `;
          }
        } finally {
          if (loadingIcon) {
            loadingIcon.style.display = "none";
          }
        }
      };

      if (typeof includeFunctions !== "undefined") {
        includeFunctions.push(browseInit);
      } else {
        window.addEventListener(
          "DOMContentLoaded",
          function () {
            if (window.cb_items) {
              browseInit(window.cb_items);
            }
          }
        );
      }
    })();
</script>
