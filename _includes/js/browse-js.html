<script>
  /* ========= Helpers (new schema) ========= */

  function getObjectTitle(o) {
    return (
      o.title ||
      o.title_page_title ||
      o.title_eng ||
      o.title_tib ||
      o.filename ||
      "Untitled"
    );
  }

  function getFormatFromFilename(o) {
    if (!o || !o.filename) return "record";
    const fn = String(o.filename).toLowerCase().trim();
    if (fn.endsWith(".pdf")) return "pdf";
    if (/\.(jpg|jpeg|png|gif|webp|tif|tiff|bmp|svg)$/.test(fn)) return "image";
    if (/\.(mp3|wav|m4a|flac|ogg)$/.test(fn)) return "audio";
    if (/\.(mp4|mov|webm|m4v|avi)$/.test(fn)) return "video";
    return "record";
  }

  function findFileLink(o) {
    if (!o.filename) return "";
    return o.filename.includes("/")
      ? o.filename
      : "{{ '/objects/' | relative_url }}" + o.filename;
  }

  function getThumbHTML(o) {
    const fmt = getFormatFromFilename(o);
    const link = findFileLink(o);
    const title = getObjectTitle(o);

    if (fmt === "image" && link) {
      return `<img class="card-img-top" loading="lazy" src="${link}" alt="${title}">`;
    }
    const icon =
      fmt === "pdf"
        ? "icon-pdf"
        : fmt === "audio"
        ? "icon-audio"
        : fmt === "video"
        ? "icon-video"
        : "icon-default";
    return `
      <div class="ratio ratio-1x1 d-flex align-items-center justify-content-center text-muted" style="background:#f8f9fa;">
        <svg class="bi" width="48" height="48" aria-hidden="true">
          <use xlink:href="{{ '/assets/lib/cb-icons.svg' | relative_url }}#${icon}" />
        </svg>
      </div>`;
  }

  function recordToCard(o) {
    const title = getObjectTitle(o);
    const fmt = getFormatFromFilename(o);
    const link = findFileLink(o);
    const subtitleParts = [];
    if (o.author) subtitleParts.push(o.author);
    if (o.pub_year) subtitleParts.push(o.pub_year);
    if (o.series) subtitleParts.push(o.series);
    const subtitle = subtitleParts.join(" · ");

    const mediaBadge =
      fmt === "record"
        ? ""
        : `<span class="badge bg-light text-dark border">${fmt.toUpperCase()}</span>`;

    return `
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-3">
        <div class="card h-100">
          ${getThumbHTML(o)}
          <div class="card-body">
            <h3 class="h6 card-title mb-1">
              <a class="stretched-link text-decoration-none"
                 href="{{ '/item.html' | relative_url }}?id=${encodeURIComponent(
                   o.objectid
                 )}">
                 ${title}
              </a>
            </h3>
            ${subtitle ? `<div class="text-muted small">${subtitle}</div>` : ``}
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted">${o.objectid || ""}</small>
            ${mediaBadge}
          </div>
        </div>
      </div>`;
  }

  /* ========= Filtering & Sorting ========= */

  function normalize(s) {
    return (s || "").toString().toLowerCase();
  }

  function itemMatchesQuery(o, q) {
    if (!q) return true;
    q = normalize(q);
    // Search across common fields
    const hay = [
      o.objectid,
      o.title,
      o.title_page_title,
      o.title_eng,
      o.title_tib,
      o.author,
      o.author_tib,
      o.author_phonetics,
      o.pub_year,
      o.series,
      o.location,
      o.bdrc_description,
      o.filename,
    ]
      .map(normalize)
      .join(" ");
    return hay.indexOf(q) !== -1;
  }

  function sortItems(items, key) {
    if (key === "random") {
      // Fisher-Yates shuffle
      const a = items.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    if (key === "title") {
      return items
        .slice()
        .sort((a, b) => getObjectTitle(a).localeCompare(getObjectTitle(b)));
    }
    // Arbitrary field sort (from _data/config-browse.yml)
    return items.slice().sort((a, b) => {
      const av = (a[key] ?? "").toString();
      const bv = (b[key] ?? "").toString();
      // numeric if both numbers, else string
      const an = Number(av),
        bn = Number(bv);
      if (!isNaN(an) && !isNaN(bn)) return an - bn;
      return av.localeCompare(bv);
    });
  }

  /* ========= Render ========= */

  function renderBrowse(items) {
    const el = document.getElementById("browseItems");
    el.innerHTML = items.map(recordToCard).join("");
    const countEl = document.getElementById("numberOf");
    if (countEl) countEl.textContent = items.length + " items";
  }

  /* ========= Page wiring ========= */

  (function () {
    const loading = document.getElementById("loadingIcon");
    const filterInput = document.getElementById("filterTextBox");
    const sortLabel = document.getElementById("sortFilter");

    // State
    let ALL = []; // all items from cb_items
    let VIEW = []; // filtered/sorted

    // Called by your "Search" button/form
    window.submitFilter = function () {
      const q = filterInput ? filterInput.value.trim() : "";
      VIEW = ALL.filter((o) => itemMatchesQuery(o, q));
      const activeSort = document.querySelector(".browse-sort-item.active");
      const key = activeSort
        ? activeSort.getAttribute("data-filter")
        : "random";
      VIEW = sortItems(VIEW, key);
      renderBrowse(VIEW);
    };

    window.resetFilter = function () {
      if (filterInput) filterInput.value = "";
      document
        .querySelectorAll(".browse-sort-item")
        .forEach((btn) => btn.classList.remove("active"));
      const randomBtn = document.querySelector(
        '.browse-sort-item[data-filter="random"]'
      );
      if (randomBtn) {
        randomBtn.classList.add("active");
        sortLabel.textContent = "Random";
      }
      VIEW = sortItems(ALL, "random");
      renderBrowse(VIEW);
    };

    // Sort dropdown clicks
    document.addEventListener("click", function (e) {
      const btn = e.target.closest(".browse-sort-item");
      if (!btn) return;
      document
        .querySelectorAll(".browse-sort-item")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const key = btn.getAttribute("data-filter");
      if (sortLabel)
        sortLabel.textContent =
          key === "random"
            ? "Random"
            : key === "title"
            ? "Title"
            : btn.textContent;
      // Re-apply on current view
      const q = filterInput ? filterInput.value.trim() : "";
      VIEW = ALL.filter((o) => itemMatchesQuery(o, q));
      VIEW = sortItems(VIEW, key);
      renderBrowse(VIEW);
    });

    // Main init once cb_items is available
    var browseInit = function (cb_items) {
      try {
        // Ensure we at least have objectid (required) and adapt to new schema
        ALL = cb_items.filter((o) => o && o.objectid);
        // Initial: random
        VIEW = sortItems(ALL, "random");
        renderBrowse(VIEW);
      } finally {
        if (loading) loading.style.display = "none";
      }
    };

    // Hook into CollectionBuilder’s loader pipeline
    if (window.includeFunctions) {
      includeFunctions.push(browseInit);
    } else {
      // Fallback: if includeFunctions not defined, run later
      window.addEventListener("DOMContentLoaded", () => {
        if (window.cb_items) browseInit(window.cb_items);
      });
    }
  })();
</script>
