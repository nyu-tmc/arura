{%- if site.data.theme.icons -%} {% assign icons = site.data.theme.icons %} {%-
else -%} {% assign cb_icons = site.pages | where: "name", "cb-icons.svg" | first
%} {% assign icons = cb_icons.icons %} {%- endif -%} {%- assign stubs =
site.data.config-nav | map: "stub" | join: ";" -%}

<script>
    function hasValue(value) {
      return value !== undefined && value !== null && String(value).trim() !== "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getObjectTitle(item) {
      if (!item) return "Untitled";

      return (
        item.title ||
        item.title_eng ||
        item.title_page_title ||
        item.title_tib ||
        item.filename ||
        "Untitled"
      );
    }

    function getFormatFromFilename(item) {
      if (!item || !hasValue(item.filename)) return "record";

      const filename = String(item.filename).toLowerCase().trim();

      if (filename.endsWith(".pdf")) return "pdf";
      if (/\.(jpg|jpeg|png|gif|webp|tif|tiff|bmp|svg)$/.test(filename)) return "image";
      if (/\.(mp3|wav|m4a|flac|ogg)$/.test(filename)) return "audio";
      if (/\.(mp4|mov|webm|m4v|avi)$/.test(filename)) return "video";

      return "record";
    }

    function resolveProjectPath(value, defaultDirectory) {
      if (!hasValue(value)) return "";

      const raw = String(value).trim();

      if (/^https?:\/\//i.test(raw)) return raw;

      if (raw.includes("/")) {
        return "{{ '' | relative_url }}" + (raw.startsWith("/") ? raw : "/" + raw);
      }

      return (
        "{{ '' | relative_url }}/" +
        defaultDirectory.replace(/^\/|\/$/g, "") +
        "/" +
        raw
      );
    }

    function findFileLink(item) {
      return resolveProjectPath(item && item.filename, "objects");
    }

    function findCoverLink(item) {
      return resolveProjectPath(item && item.cover, "objects");
    }

    function copyCitation(citationId) {
      const el = document.getElementById(citationId);
      if (!el) return;

      const text = el.innerText.trim();

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          () => alert("Citation copied to clipboard!"),
          (err) => alert("Failed to copy citation: " + err)
        );
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";

      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand("copy");
        alert("Citation copied to clipboard!");
      } catch (err) {
        alert("Failed to copy citation: " + err);
      }

      document.body.removeChild(textarea);
    }

  function normalizeCitationValue(value) {
    return String(value || "")
      // remove any accidental HTML tags
      .replace(/<[^>]*>/g, " ")

      // remove accidental Markdown italics markers if they exist in the sheet
      .replace(/\*/g, "")

      // convert HTML/non-breaking spaces to normal spaces
      .replace(/&nbsp;/g, " ")
      .replace(/[\u00A0\u1680\u2000-\u200A\u202F\u205F\u3000]/g, " ")

      // collapse repeated spaces / line breaks / tabs
      .replace(/\s+/g, " ")

      // remove spaces before punctuation
      .replace(/\s+([.,;:])/g, "$1")

      .trim();
  }

    function sameCitationTitle(a, b) {
      return (
        normalizeCitationValue(a).toLowerCase() ===
        normalizeCitationValue(b).toLowerCase()
      );
    }

    function buildCitation(item) {
      const parts = [];

      const author = normalizeCitationValue(item.author);
      const year = normalizeCitationValue(item.pub_year);

      const titlePageTitle = normalizeCitationValue(
        item.title_page_title ||
        item.title ||
        item.title_eng ||
        item.title_tib
      );

      const containerTitle = normalizeCitationValue(item.title);

      const seriesTitle = normalizeCitationValue(
        item.series ||
        item.series_eng ||
        item.series_tib ||
        item.series_chi_characters
      );

      const seriesNumber = normalizeCitationValue(item.seriesnumber);
      const location = normalizeCitationValue(item.location);
      const publisher = normalizeCitationValue(item.publisher);

      if (author) {
        parts.push(escapeHtml(author) + ".");
      }

      if (year) {
        parts.push(escapeHtml(year) + ".");
      }

      if (titlePageTitle) {
        parts.push("<i>" + escapeHtml(titlePageTitle) + "</i>.");
      }

      if (
        containerTitle &&
        titlePageTitle &&
        !sameCitationTitle(containerTitle, titlePageTitle)
      ) {
        parts.push("In <i>" + escapeHtml(containerTitle) + "</i>.");
      }

      if (seriesTitle && seriesNumber) {
        parts.push(
          escapeHtml(seriesTitle) +
            ", vol. " +
            escapeHtml(seriesNumber) +
            "."
        );
      } else if (seriesTitle) {
        parts.push(escapeHtml(seriesTitle) + ".");
      } else if (seriesNumber) {
        parts.push("Vol. " + escapeHtml(seriesNumber) + ".");
      }

      if (location && publisher) {
        parts.push(escapeHtml(location) + ": " + escapeHtml(publisher) + ".");
      } else if (location) {
        parts.push(escapeHtml(location) + ".");
      } else if (publisher) {
        parts.push(escapeHtml(publisher) + ".");
      }

      return parts.join(" ");
    }

    function renderMetadataValue(value, externalLink) {
      if (externalLink) {
        return (
          '<a href="' +
          escapeHtml(value) +
          '" target="_blank" rel="noopener">' +
          escapeHtml(value) +
          "</a>"
        );
      }

      return escapeHtml(value).replace(/\n/g, "<br>");
    }

    function generateMetadata(item) {
      let html = '<dl class="row item-metadata-list">';

      {% for field in site.data.config-metadata %}
        (function () {
          const fieldName = {{ field.field | jsonify }};
          const fieldValue = item[fieldName];

          if (!hasValue(fieldValue)) return;

          html += '<dt class="col-sm-4">{{ field.display_name | escape }}:</dt>';
          html += '<dd class="col-sm-8">';

          {% if field.external_link == true or field.external_link == "true" %}
            html += renderMetadataValue(fieldValue, true);
          {% else %}
            html += renderMetadataValue(fieldValue, false);
          {% endif %}

          html += "</dd>";
        })();
      {% endfor %}

      html += "</dl>";

      const citation = buildCitation(item);

      if (citation) {
        const citationId =
          "citation-text-" +
          String(item.objectid || "item").replace(/[^a-zA-Z0-9_-]/g, "-");

        html += '<hr><div class="mb-3">';
        html += '<h3 class="h6">Citation</h3>';
        html += '<div class="small text-muted" id="' + citationId + '">' + citation + "</div>";
        html +=
          '<button class="btn btn-sm btn-outline-secondary mt-2" type="button" ' +
          'onclick="copyCitation(\'' + citationId + '\')">Copy Citation</button>';
        html += "</div>";
      }

      return html;
    }

    function createNoObjectDisplay(item) {
      const coverLink = findCoverLink(item);
      const title = getObjectTitle(item);

      if (coverLink) {
        return `
          <div class="text-center">
            <img
              class="img-fluid"
              src="${coverLink}"
              alt="Cover of ${escapeHtml(title)}"
              style="max-height:75vh;object-fit:contain;"
            >
          </div>
        `;
      }

      return `
        <div class="alert alert-secondary text-center mb-0">
          No digital object is currently available for this item.
        </div>
      `;
    }

    function createItemDisplay(item) {
      const fileLink = findFileLink(item);
      const format = getFormatFromFilename(item);
      const title = getObjectTitle(item);

      if (!fileLink) {
        return createNoObjectDisplay(item);
      }

      if (format === "pdf") {
        return `
          <div class="ratio ratio-4x3">
            <object
              title="PDF file of ${escapeHtml(title)}"
              data="${fileLink}"
              type="application/pdf"
              width="100%"
            >
              <p>
                The PDF is not rendering in your browser.
                <a href="${fileLink}" target="_blank" rel="noopener">Open the PDF</a>.
              </p>
            </object>
          </div>
        `;
      }

      if (format === "image") {
        return `
          <a class="spotlight gallery-img" data-download="true" href="${fileLink}">
            <img
              class="img-fluid"
              src="${fileLink}"
              alt="${escapeHtml(title)}"
              style="max-height:80vh;object-fit:contain;"
            >
            <div><small class="text-dark">Click to view full screen</small></div>
          </a>
        `;
      }

      if (format === "audio") {
        return `
          <audio controls class="w-100">
            <source src="${fileLink}">
            Your browser does not support audio playback.
          </audio>
        `;
      }

      if (format === "video") {
        return `
          <video controls class="w-100">
            <source src="${fileLink}">
            Your browser does not support video playback.
          </video>
        `;
      }

      return `
        <a href="${fileLink}" target="_blank" rel="noopener" class="btn btn-outline-primary">
          Open Object
        </a>
      `;
    }

    function createDownloadButton(item) {
      const fileLink = findFileLink(item);
      if (!fileLink) return "";

      const format = getFormatFromFilename(item);

      const label =
        format === "pdf" ? "Download PDF" :
        format === "image" ? "Download Image" :
        format === "audio" ? "Download Audio" :
        format === "video" ? "Download Video" :
        "Download Object";

      return `
        <a href="${fileLink}" target="_blank" rel="noopener" class="btn btn-outline-primary">
          ${label}
        </a>
      `;
    }

    function createItemButtons(item) {
      const buttons = [];

      {% if stubs contains "map" %}
        if (hasValue(item.latitude) && hasValue(item.longitude)) {
          const mapUrl =
            "{{ '/map.html' | relative_url }}" +
            "?location=" +
            encodeURIComponent(item.latitude + "," + item.longitude) +
            "&marker=" +
            encodeURIComponent(item.objectid || "");

          buttons.push(
            '<a href="' + mapUrl + '" class="btn btn-outline-primary">View on Map</a>'
          );
        }
      {% endif %}

      const downloadButton = createDownloadButton(item);

      if (downloadButton) {
        buttons.push(downloadButton);
      }

      if (!buttons.length) return "";

      return (
        '<div class="btn-group flex-wrap" role="group" aria-label="Item options">' +
        buttons.join("") +
        "</div>"
      );
    }

    function createBrowseNavigation(previousId, nextId) {
      if (!hasValue(previousId) || !hasValue(nextId)) return;

      const previousUrl =
        "{{ '/item.html' | relative_url }}" + "?id=" + encodeURIComponent(previousId);

      const nextUrl =
        "{{ '/item.html' | relative_url }}" + "?id=" + encodeURIComponent(nextId);

      const itemNav = document.getElementById("item-nav");
      const browseButtons = document.getElementById("browse-buttons");

      if (itemNav) {
        itemNav.innerHTML = `
          <div class="d-none d-md-block">
            <a class="previous btn btn-lg btn-secondary" href="${previousUrl}" aria-label="Previous item">&laquo;</a>
            <a class="next btn btn-lg btn-secondary" href="${nextUrl}" aria-label="Next item">&raquo;</a>
          </div>
        `;
      }

      if (browseButtons) {
        browseButtons.innerHTML = `
          <a class="btn btn-secondary" href="${previousUrl}">&laquo; Previous</a>
          <a class="btn btn-secondary" href="{{ '/browse.html' | relative_url }}">Back to Arura</a>
          <a class="btn btn-secondary" href="${nextUrl}">Next &raquo;</a>
        `;
      }

      document.onkeydown = function (event) {
        const spotlight = document.getElementById("spotlight");
        if (spotlight && spotlight.classList.contains("show")) return;

        if (event.key === "ArrowLeft") window.location.href = previousUrl;
        if (event.key === "ArrowRight") window.location.href = nextUrl;
      };
    }

    function displayItem(record, previousId, nextId) {
      const objectTitle = getObjectTitle(record);
      const format = getFormatFromFilename(record);

      const breadcrumbTitle = document.getElementById("bc-title");
      const itemFormat = document.getElementById("item-format");
      const itemTitle = document.getElementById("item-title");
      const itemContent = document.getElementById("item-content");
      const itemMetadata = document.getElementById("item-metadata");

      if (breadcrumbTitle) breadcrumbTitle.textContent = objectTitle;
      if (itemFormat) itemFormat.textContent = format === "record" ? "" : format.toUpperCase();

      if (itemTitle) {
        itemTitle.innerHTML =
          escapeHtml(objectTitle) +
          '<a href="#item-metadata" class="ms-3 btn btn-sm btn-outline-dark small">' +
          'Item Info <svg class="bi icon-sprite" role="img" aria-label="Jump to Item Info">' +
          '<use xlink:href="{{ "/assets/lib/cb-icons.svg" | relative_url }}#arrow-down"/>' +
          "</svg></a>";
      }

      const mediaHtml = createItemDisplay(record);
      const buttonsHtml = createItemButtons(record);

      if (itemContent) {
        itemContent.innerHTML = `
          <div class="card mb-4 text-center">
            <div class="card-body">
              ${mediaHtml}
              ${buttonsHtml ? `<div class="mt-3">${buttonsHtml}</div>` : ""}
            </div>
          </div>
        `;
      }

      if (itemMetadata) {
        itemMetadata.innerHTML = generateMetadata(record);
      }

      {% if site.data.theme["browse-buttons"] == true %}
        createBrowseNavigation(previousId, nextId);
      {% endif %}
    }

    const currentUrl = new URL(window.location.href);
    const itemPageId = currentUrl.searchParams.get("id");

    const itemPageInit = function (cbItems) {
      const loading = document.getElementById("loading");

      try {
        if (!Array.isArray(cbItems)) {
          throw new Error("Collection data is not an array.");
        }

        const recordIndex = cbItems.findIndex(function (item) {
          return (
            item &&
            hasValue(item.objectid) &&
            String(item.objectid) === String(itemPageId)
          );
        });

        if (recordIndex === -1) {
          const breadcrumbTitle = document.getElementById("bc-title");
          const itemTitle = document.getElementById("item-title");

          if (breadcrumbTitle) breadcrumbTitle.textContent = "Not found";

          if (itemTitle) {
            itemTitle.innerHTML =
              'Sorry, item not found. Please visit the ' +
              '<a href="{{ "/browse.html" | relative_url }}">Arura page</a>.';
          }

          return;
        }

        const record = cbItems[recordIndex];

        const parentItems = cbItems.filter(function (item) {
          return (
            item &&
            hasValue(item.objectid) &&
            !hasValue(item.parentid)
          );
        });

        const parentIndex = parentItems.findIndex(function (item) {
          return String(item.objectid) === String(itemPageId);
        });

        let previousId = "";
        let nextId = "";

        if (parentItems.length > 1 && parentIndex !== -1) {
          const lastIndex = parentItems.length - 1;

          previousId =
            parentIndex === 0
              ? parentItems[lastIndex].objectid
              : parentItems[parentIndex - 1].objectid;

          nextId =
            parentIndex === lastIndex
              ? parentItems[0].objectid
              : parentItems[parentIndex + 1].objectid;
        }

        displayItem(record, previousId, nextId);
      } catch (error) {
        console.error("Item page initialization failed:", error);

        const itemContent = document.getElementById("item-content");

        if (itemContent) {
          itemContent.innerHTML = `
            <div class="alert alert-danger">
              The item page could not load the collection data.
              Check the browser console for details.
            </div>
          `;
        }
      } finally {
        if (loading) loading.style.display = "none";
      }
    };

    if (window.includeFunctions) {
      includeFunctions.push(itemPageInit);
    } else {
      window.addEventListener("DOMContentLoaded", function () {
        if (window.cb_items) {
          itemPageInit(window.cb_items);
        }
      });
    }
</script>
